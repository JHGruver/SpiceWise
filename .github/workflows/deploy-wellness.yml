name: Deploy SpiceMight to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      # Build Marketing Website (root /)
      - name: Build Marketing Website
        run: npm run build
        working-directory: apps/website

      # Build Web App (/app)
      - name: Build Web App
        run: npm run build
        working-directory: apps/web-app

      # Build Wellness Dashboard (/wellness)
      - name: Build Wellness Dashboard
        run: npm run build
        working-directory: apps/wellness-dashboard

      # Combine all builds into one directory
      - name: Create combined dist
        run: |
          mkdir -p combined-dist

          # Copy marketing website to root
          cp -r apps/website/dist/* combined-dist/

          # Copy web app to /app subdirectory
          mkdir -p combined-dist/app
          cp -r apps/web-app/dist/* combined-dist/app/

          # Copy wellness dashboard to /wellness subdirectory
          mkdir -p combined-dist/wellness
          cp -r apps/wellness-dashboard/dist/* combined-dist/wellness/

          # Add CNAME file
          echo "spicemight.com" > combined-dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'combined-dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
